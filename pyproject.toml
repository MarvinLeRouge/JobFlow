[project]
name = "jobflow"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "google-auth-httplib2>=0.4.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "pre-commit>=4.7.0",
    "pip-audit>=2.10.1",
    "mypy>=2.4.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
# archive/ holds old local scripts, gitignored
exclude = ["^archive/"]

# Google client libraries ship no type information
[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.report]
# CLI entry blocks only parse argv and call the tested main()/run() functions
exclude_also = ['if __name__ == .__main__.:']
