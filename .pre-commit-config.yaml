default_install_hook_types: [pre-commit, post-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: changelog
        name: Update CHANGELOG.md (git-cliff)
        entry: bash scripts/changelog-post-commit.sh
        language: system
        stages: [post-commit]
        pass_filenames: false
        always_run: true
